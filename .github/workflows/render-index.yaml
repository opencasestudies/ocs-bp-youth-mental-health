on:
  push:
    branches:
      - main
      - master

name: render-index

jobs:
  render:
    name: render-index
    runs-on: macOS-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Install remotes and update R packages
        run: |
          install.packages("remotes")
          update.packages(ask = FALSE, checkBuilt = TRUE)
        shell: Rscript {0}
      - name: Install rmarkdown and project dependencies
        run: |
          remotes::install_cran("rmarkdown", upgrade = "always")
          remotes::install_deps(dependencies = TRUE, upgrade = "always")
        shell: Rscript {0}
      - name: Render index Rmd
        run: Rscript -e 'rmarkdown::render("index.Rmd")'
      - name: Commit results
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git commit index.html img/mainplot.png data/wrangled_data.rda -m 'Re-build index.Rmd' || echo "No changes to commit"
          git push origin || echo "No changes to commit"
